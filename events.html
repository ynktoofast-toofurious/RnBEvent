<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNB Events RSVP</title>
    <meta name="description" content="Your RSVP dashboard — upcoming, hosting, drafts and more.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="event.css">
    <style>
        /* ── Dashboard hero ─────────────────────────── */
        body {
            margin:0;
            min-height:100vh;
            background:
                radial-gradient(ellipse 1200px 700px at 30% -10%, rgba(184,154,94,0.22), transparent 60%),
                radial-gradient(ellipse 900px 600px at 90% 20%, rgba(119,163,97,0.18), transparent 60%),
                radial-gradient(ellipse 1000px 700px at 10% 90%, rgba(58,42,82,0.35), transparent 60%),
                linear-gradient(180deg, #0e1410 0%, #161e16 40%, #0e1410 100%);
            color:#f3ede0;
            font-family:'Montserrat', system-ui, sans-serif;
        }

        /* Topbar overrides for dashboard */
        .dash-topbar {
            position:sticky; top:0; z-index:50;
            display:flex; align-items:center; justify-content:space-between;
            padding:16px 32px;
            backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
            background:rgba(14,20,16,0.55);
            border-bottom:1px solid rgba(184,154,94,0.18);
        }
        .dash-topbar__logo {
            display:flex; align-items:center; gap:10px;
            text-decoration:none; color:#f3ede0;
            font-family:'Cormorant Garamond', serif;
            font-weight:600; font-size:18px; letter-spacing:3px;
        }
        .dash-topbar__logo img { width:34px; height:34px; }
        .dash-topbar__actions { display:flex; align-items:center; gap:10px; }
        .dash-icon-btn {
            width:40px; height:40px; border-radius:50%;
            border:1px solid rgba(184,154,94,0.25);
            background:rgba(255,255,255,0.04); cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            color:#d9c896; transition:all 0.15s;
        }
        .dash-icon-btn:hover { background:rgba(184,154,94,0.12); color:#f3ede0; }
        .dash-icon-btn--bell { position:relative; }
        .dash-icon-btn__dot {
            position:absolute; top:6px; right:7px;
            width:8px; height:8px; border-radius:50%;
            background:#e84a4a; box-shadow:0 0 0 2px #0e1410;
        }
        .dash-create-btn {
            display:inline-flex; align-items:center; gap:8px;
            padding:10px 22px; border-radius:999px;
            background:linear-gradient(135deg, #b89a5e 0%, #d4b876 100%);
            color:#1a1a1a; text-decoration:none; border:none; cursor:pointer;
            font-weight:600; font-size:14px;
            box-shadow:0 4px 18px rgba(184,154,94,0.35);
            transition:transform 0.15s, box-shadow 0.15s;
        }
        .dash-create-btn:hover { transform:translateY(-1px); box-shadow:0 6px 22px rgba(184,154,94,0.5); }
        .dash-profile-pill {
            display:flex; align-items:center; gap:8px;
            padding:5px 14px 5px 5px; border-radius:999px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(184,154,94,0.25);
            cursor:pointer; color:#f3ede0;
            transition:background 0.15s;
        }
        .dash-profile-pill:hover { background:rgba(184,154,94,0.15); }
        .dash-profile-pill__avatar {
            width:30px; height:30px; border-radius:50%;
            background:linear-gradient(135deg, #b89a5e 0%, #77a361 100%);
            display:flex; align-items:center; justify-content:center;
            font-weight:700; color:#1a1a1a; font-size:13px;
        }
        .dash-profile-pill svg { opacity:0.6; }

        /* Hero */
        .dash-hero { max-width:1280px; margin:0 auto; padding:60px 32px 32px; }
        .dash-hero__title {
            font-family:'Cormorant Garamond', serif;
            font-weight:600; font-size:clamp(38px, 6vw, 64px);
            margin:0 0 14px; letter-spacing:-0.5px;
            color:#f3ede0;
        }
        .dash-hero__title em {
            font-style:normal;
            background:linear-gradient(135deg, #d4b876 0%, #b89a5e 100%);
            -webkit-background-clip:text; background-clip:text;
            -webkit-text-fill-color:transparent;
        }
        .dash-hero__sub { font-size:15px; color:rgba(243,237,224,0.65); margin:0; }
        .dash-hero__sub strong { color:#d4b876; font-weight:600; }

        /* Filter tabs */
        .dash-tabs {
            display:flex; gap:8px; flex-wrap:wrap;
            margin:36px 0 28px;
        }
        .dash-tab {
            display:inline-flex; align-items:center; gap:8px;
            padding:9px 18px; border-radius:999px;
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(184,154,94,0.15);
            color:#d9c896; cursor:pointer;
            font-size:14px; font-weight:500;
            transition:all 0.15s;
        }
        .dash-tab:hover { background:rgba(184,154,94,0.12); color:#f3ede0; }
        .dash-tab.is-active {
            background:#f3ede0; color:#1a1a1a; border-color:#f3ede0;
            font-weight:600;
        }
        .dash-tab__count {
            display:inline-flex; align-items:center; justify-content:center;
            min-width:18px; padding:0 6px; height:18px;
            border-radius:9px; font-size:11px; font-weight:600;
            background:rgba(0,0,0,0.15);
        }
        .dash-tab.is-active .dash-tab__count { background:rgba(0,0,0,0.12); color:#1a1a1a; }

        /* Search input (hidden until Search tab) */
        .dash-search-wrap { margin-bottom:24px; display:none; }
        .dash-search-wrap.is-open { display:block; }
        .dash-search-input {
            width:100%; max-width:480px;
            padding:12px 18px; border-radius:14px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(184,154,94,0.25);
            color:#f3ede0; font-size:14px;
            outline:none; transition:border 0.15s;
            font-family:inherit;
        }
        .dash-search-input:focus { border-color:#d4b876; }

        /* Main layout: chat + thumbs */
        .dash-main {
            max-width:1280px; margin:0 auto; padding:0 32px 80px;
            display:grid;
            grid-template-columns:minmax(0, 1fr) 340px;
            gap:28px;
            align-items:start;
        }

        /* Chat panel */
        .dash-chat {
            display:flex; flex-direction:column;
            min-height:540px; max-height:78vh;
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(184,154,94,0.22);
            border-radius:24px;
            overflow:hidden;
            backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
        }
        .dash-chat__header {
            display:flex; align-items:center; justify-content:space-between;
            padding:16px 22px;
            border-bottom:1px solid rgba(184,154,94,0.18);
            background:rgba(0,0,0,0.18);
        }
        .dash-chat__brand { display:flex; align-items:center; gap:12px; }
        .dash-chat__orb {
            width:36px; height:36px; border-radius:50%;
            background:linear-gradient(135deg, #d4b876 0%, #b89a5e 60%, #77a361 100%);
            display:flex; align-items:center; justify-content:center;
            color:#1a1a1a;
            box-shadow:0 0 24px rgba(184,154,94,0.5);
        }
        .dash-chat__title { font-family:'Cormorant Garamond', serif; font-weight:600; font-size:18px; color:#f3ede0; }
        .dash-chat__sub { font-size:11.5px; color:rgba(243,237,224,0.5); letter-spacing:0.3px; margin-top:1px; }
        .dash-chat__gear {
            width:34px; height:34px; border-radius:50%;
            background:transparent; border:1px solid rgba(184,154,94,0.2);
            color:#d9c896; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            transition:background 0.15s;
        }
        .dash-chat__gear:hover { background:rgba(184,154,94,0.12); }

        .dash-chat__messages {
            flex:1; overflow-y:auto; padding:24px 24px 8px;
            display:flex; flex-direction:column; gap:14px;
            scrollbar-width:thin; scrollbar-color:rgba(184,154,94,0.3) transparent;
        }
        .dash-chat__messages::-webkit-scrollbar { width:6px; }
        .dash-chat__messages::-webkit-scrollbar-thumb { background:rgba(184,154,94,0.25); border-radius:3px; }

        .dash-chat__welcome { text-align:center; padding:24px 12px; }
        .dash-chat__welcome h2 {
            font-family:'Cormorant Garamond', serif;
            font-weight:600; font-size:30px;
            color:#f3ede0; margin:0 0 8px;
            background:linear-gradient(135deg, #f3ede0 0%, #d4b876 100%);
            -webkit-background-clip:text; background-clip:text;
            -webkit-text-fill-color:transparent;
        }
        .dash-chat__welcome p { color:rgba(243,237,224,0.6); font-size:14px; margin:0 0 20px; max-width:480px; margin-left:auto; margin-right:auto; }
        .dash-chat__chips {
            display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
            margin-top:16px;
        }
        .dash-chat__chip {
            padding:8px 14px; border-radius:999px;
            background:rgba(184,154,94,0.1);
            border:1px solid rgba(184,154,94,0.25);
            color:#d9c896; font-size:13px;
            cursor:pointer; font-family:inherit;
            transition:all 0.15s;
        }
        .dash-chat__chip:hover { background:rgba(184,154,94,0.2); color:#f3ede0; transform:translateY(-1px); }

        .dash-chat__msg { max-width:82%; }
        .dash-chat__msg--user {
            align-self:flex-end;
            padding:11px 16px; border-radius:18px 18px 4px 18px;
            background:linear-gradient(135deg, #b89a5e 0%, #d4b876 100%);
            color:#1a1a1a; font-size:14px; line-height:1.5;
            font-weight:500;
        }
        .dash-chat__msg--ai {
            align-self:flex-start;
            padding:12px 18px; border-radius:18px 18px 18px 4px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(184,154,94,0.18);
            color:#f3ede0; font-size:14px; line-height:1.6;
            white-space:pre-wrap; word-wrap:break-word;
        }
        .dash-chat__msg--ai a { color:#d4b876; }
        .dash-chat__typing {
            display:inline-flex; gap:4px; padding:14px 18px;
            background:rgba(255,255,255,0.06); border-radius:18px 18px 18px 4px;
            align-self:flex-start;
        }
        .dash-chat__typing span {
            width:6px; height:6px; border-radius:50%; background:#d4b876;
            animation:typing 1.2s infinite ease-in-out;
        }
        .dash-chat__typing span:nth-child(2) { animation-delay:0.15s; }
        .dash-chat__typing span:nth-child(3) { animation-delay:0.3s; }
        @keyframes typing { 0%, 60%, 100% { opacity:0.3; transform:translateY(0); } 30% { opacity:1; transform:translateY(-4px); } }

        .dash-chat__input {
            display:flex; align-items:flex-end; gap:10px;
            padding:14px 18px;
            border-top:1px solid rgba(184,154,94,0.18);
            background:rgba(0,0,0,0.18);
        }
        .dash-chat__input textarea {
            flex:1; resize:none; max-height:140px;
            padding:11px 14px; border-radius:14px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(184,154,94,0.22);
            color:#f3ede0; font-family:inherit; font-size:14px;
            outline:none; transition:border 0.15s;
            line-height:1.45;
        }
        .dash-chat__input textarea:focus { border-color:#d4b876; }
        .dash-chat__send {
            width:42px; height:42px; border-radius:50%;
            background:linear-gradient(135deg, #b89a5e 0%, #d4b876 100%);
            color:#1a1a1a; border:none; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            box-shadow:0 4px 14px rgba(184,154,94,0.35);
            transition:transform 0.12s, box-shadow 0.15s;
        }
        .dash-chat__send:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(184,154,94,0.5); }
        .dash-chat__send:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

        /* Right rail thumbs */
        .dash-thumbs {
            display:flex; flex-direction:column; gap:14px;
            position:sticky; top:96px;
            max-height:calc(100vh - 110px); overflow-y:auto; padding-right:4px;
            scrollbar-width:thin; scrollbar-color:rgba(184,154,94,0.3) transparent;
        }
        .dash-thumbs::-webkit-scrollbar { width:6px; }
        .dash-thumbs::-webkit-scrollbar-thumb { background:rgba(184,154,94,0.25); border-radius:3px; }
        .dash-card {
            position:relative; aspect-ratio:1/1;
            border-radius:18px; overflow:hidden; cursor:pointer;
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(184,154,94,0.18);
            transition:transform 0.2s, box-shadow 0.2s, border 0.2s;
            text-decoration:none; color:inherit; display:block;
        }
        .dash-card:hover {
            transform:translateY(-2px);
            box-shadow:0 16px 40px rgba(0,0,0,0.5);
            border-color:rgba(184,154,94,0.45);
        }
        .dash-card__cover { position:absolute; inset:0; background-size:cover; background-position:center; background-color:#1f2a1f; }
        .dash-card__cover--placeholder {
            background:linear-gradient(135deg, #2c3e2c 0%, #1a2a1a 50%, #3d2e1a 100%);
            display:flex; align-items:center; justify-content:center;
            color:rgba(184,154,94,0.4); font-family:'Cormorant Garamond',serif; font-size:42px;
        }
        .dash-card__shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,0.85) 100%); }
        .dash-card__date { position:absolute; top:12px; left:12px; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,0.92); color:#1a1a1a; font-size:11.5px; font-weight:600; }
        .dash-card__menu {
            position:absolute; top:10px; right:10px;
            width:30px; height:30px; border-radius:50%;
            background:rgba(0,0,0,0.55); color:#fff; backdrop-filter:blur(6px);
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; border:none; padding:0;
            opacity:1; transition:background 0.15s;
        }
        .dash-card__menu:hover { background:rgba(0,0,0,0.75); }
        .dash-card__badge { position:absolute; bottom:54px; left:12px; padding:4px 10px; border-radius:999px; background:#fff; color:#1a1a1a; font-size:10.5px; font-weight:700; letter-spacing:0.4px; display:inline-flex; align-items:center; gap:5px; }
        .dash-card__badge--draft { background:rgba(212,184,118,0.95); color:#1a1a1a; }
        .dash-card__badge--published { background:rgba(119,163,97,0.95); color:#fff; }
        .dash-card__title { position:absolute; bottom:0; left:0; right:0; padding:14px 16px; font-size:15px; font-weight:600; color:#fff; letter-spacing:-0.2px; line-height:1.25; }

        /* New event tile (vertical rail) */
        .dash-card--new {
            aspect-ratio:1/1;
            border:2px dashed rgba(184,154,94,0.35);
            background:transparent;
            display:flex; align-items:center; justify-content:center; gap:8px;
            color:#d4b876; font-weight:600; font-size:14px;
            text-decoration:none; cursor:pointer;
            border-radius:18px;
            transition:all 0.2s;
        }
        .dash-card--new:hover { background:rgba(184,154,94,0.08); border-color:#d4b876; color:#f3ede0; }

        /* Loading skeleton */
        .dash-skel {
            aspect-ratio:1/1; border-radius:18px;
            background:linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 100%);
            background-size:200% 100%;
            animation:skel 1.4s linear infinite;
        }
        @keyframes skel { from { background-position:0% 0%; } to { background-position:-200% 0%; } }

        /* Card empty state */
        .dash-thumbs__empty { padding:30px 14px; text-align:center; color:rgba(243,237,224,0.5); font-size:13px; }

        /* Ellipsis popover */
        .dash-popover {
            position:fixed; z-index:60;
            min-width:170px;
            background:rgba(20,28,22,0.97); backdrop-filter:blur(14px);
            border:1px solid rgba(184,154,94,0.3);
            border-radius:12px;
            box-shadow:0 18px 50px rgba(0,0,0,0.55);
            padding:6px;
            animation:popIn 0.14s ease;
        }
        .dash-popover.dash-popover--hidden { display:none; }
        @keyframes popIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
        .dash-popover__item {
            display:flex; align-items:center; gap:10px;
            width:100%; padding:9px 12px; border-radius:8px;
            background:none; border:none; cursor:pointer;
            color:#f3ede0; font-size:13.5px; font-family:inherit; text-align:left;
            transition:background 0.12s;
        }
        .dash-popover__item:hover { background:rgba(184,154,94,0.14); }
        .dash-popover__item--danger { color:#e8a3a3; }
        .dash-popover__item--danger:hover { background:rgba(220,80,80,0.16); }

        /* Profile dropdown */
        .dash-menu {
            position:absolute; top:54px; right:0;
            min-width:220px;
            background:rgba(20,28,22,0.96); backdrop-filter:blur(14px);
            border:1px solid rgba(184,154,94,0.25);
            border-radius:14px;
            box-shadow:0 18px 50px rgba(0,0,0,0.55);
            padding:8px;
            display:none;
            animation:menuIn 0.18s ease;
        }
        .dash-menu.is-open { display:block; }
        @keyframes menuIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
        .dash-menu__item {
            display:flex; align-items:center; gap:10px;
            width:100%; padding:10px 14px; border-radius:10px;
            background:none; border:none; cursor:pointer;
            color:#f3ede0; font-size:14px; text-align:left;
            font-family:inherit;
            transition:background 0.12s;
        }
        .dash-menu__item:hover { background:rgba(184,154,94,0.12); }
        .dash-menu__item--danger { color:#e8a3a3; }
        .dash-menu__divider { height:1px; background:rgba(184,154,94,0.18); margin:6px 4px; }
        .dash-profile-wrap { position:relative; }

        @media (max-width: 900px) {
            .dash-main { grid-template-columns:1fr; }
            .dash-thumbs { position:static; max-height:none; flex-direction:row; overflow-x:auto; padding-bottom:8px; }
            .dash-thumbs > * { flex:0 0 220px; }
        }
        @media (max-width: 640px) {
            .dash-topbar { padding:12px 18px; }
            .dash-hero { padding:40px 18px 24px; }
            .dash-main { padding:0 18px 60px; gap:18px; }
            .dash-chat { min-height:440px; }
            .dash-create-btn { padding:8px 16px; font-size:13px; }
            .dash-create-btn span { display:none; }
        }

        .hidden { display:none !important; }
    </style>
</head>
<body>

    <!-- Topbar -->
    <header class="dash-topbar">
        <a href="events.html" class="dash-topbar__logo">
            <img src="RNB Logo Olive.png" alt="RNB Events RSVP">
            <span>RNB EVENTS RSVP</span>
        </a>
        <div class="dash-topbar__actions">
            <a href="event-create.html" class="dash-create-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span>Create</span>
            </a>
            <a href="#" class="dash-icon-btn" title="Blog" style="text-decoration:none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            </a>
            <button class="dash-icon-btn" title="Help">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </button>
            <button class="dash-icon-btn" title="Explore">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            </button>
            <button class="dash-icon-btn dash-icon-btn--bell" title="Notifications">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                <span class="dash-icon-btn__dot" id="dash-notif-dot"></span>
            </button>
            <div class="dash-profile-wrap">
                <button class="dash-profile-pill" onclick="toggleProfileMenu()">
                    <span class="dash-profile-pill__avatar" id="dash-avatar">Y</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="dash-menu" id="dash-profile-menu">
                    <button class="dash-menu__item" onclick="window.location.href='event-create.html'">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        New event
                    </button>
                    <button class="dash-menu__item" onclick="window.location.href='events.html'">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                        Home
                    </button>
                    <div class="dash-menu__divider"></div>
                    <button class="dash-menu__item dash-menu__item--danger" onclick="signOut()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Sign out
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="dash-hero">
        <h1 class="dash-hero__title">Welcome back <em id="dash-name">there</em>!</h1>
        <p class="dash-hero__sub" id="dash-summary">Loading your events…</p>

        <!-- Filter tabs -->
        <div class="dash-tabs" id="dash-tabs">
            <button class="dash-tab" data-tab="search" onclick="setDashTab('search')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span>Search</span>
            </button>
            <button class="dash-tab is-active" data-tab="upcoming" onclick="setDashTab('upcoming')">
                <span>Upcoming</span><span class="dash-tab__count" data-count="upcoming">0</span>
            </button>
            <button class="dash-tab" data-tab="hosting" onclick="setDashTab('hosting')">
                <span>Hosting</span><span class="dash-tab__count" data-count="hosting">0</span>
            </button>
            <button class="dash-tab" data-tab="drafts" onclick="setDashTab('drafts')">
                <span>Drafts</span><span class="dash-tab__count" data-count="drafts">0</span>
            </button>
            <button class="dash-tab" data-tab="past" onclick="setDashTab('past')">
                <span>Past events</span><span class="dash-tab__count" data-count="past">0</span>
            </button>
        </div>

        <!-- Search input -->
        <div class="dash-search-wrap" id="dash-search-wrap">
            <input type="text" class="dash-search-input" id="dash-search-input" placeholder="Search by name, venue or date…" oninput="renderGrid()">
        </div>
    </section>

    <!-- Main: Gemini chat (left) + vertical event thumbnails (right) -->
    <div class="dash-main">
        <!-- Chat panel -->
        <section class="dash-chat" id="dash-chat">
            <header class="dash-chat__header">
                <div class="dash-chat__brand">
                    <div class="dash-chat__orb">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L13.8 8.2 L20 10 L13.8 11.8 L12 18 L10.2 11.8 L4 10 L10.2 8.2 Z"/></svg>
                    </div>
                    <div>
                        <div class="dash-chat__title">Ruthie.ai</div>
                        <div class="dash-chat__sub">Your planner assistant</div>
                    </div>
                </div>
            </header>

            <div class="dash-chat__messages" id="chat-messages">
                <div class="dash-chat__welcome">
                    <h2>What can I help you plan?</h2>
                    <p>I can brainstorm themes, write invite captions, draft event descriptions, suggest playlists &amp; more.</p>
                    <div class="dash-chat__chips">
                        <button class="dash-chat__chip" onclick="sendChatPrompt('Give me 5 elegant theme ideas for a 50th birthday celebration')">🎉 Theme ideas for a 50th</button>
                        <button class="dash-chat__chip" onclick="sendChatPrompt('Write a warm, upscale invitation caption for a summer wine tasting')">🍷 Invite caption</button>
                        <button class="dash-chat__chip" onclick="sendChatPrompt('Suggest a 10-song dinner-party playlist with classic R&amp;B vibes')">🎵 Playlist ideas</button>
                        <button class="dash-chat__chip" onclick="sendChatPrompt('Help me write a 2-sentence dress code description for a Belle Époque-themed gala')">👗 Dress code blurb</button>
                    </div>
                </div>
            </div>

            <form class="dash-chat__input" id="chat-form" onsubmit="event.preventDefault(); sendChat();">
                <textarea id="chat-input" placeholder="Ask for ideas, descriptions, captions…" rows="1"></textarea>
                <button type="submit" class="dash-chat__send" id="chat-send" title="Send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </form>
        </section>

        <!-- Right rail: vertical thumbnails -->
        <aside class="dash-thumbs" id="dash-grid">
            <a class="dash-card--new" href="event-create.html?new=1">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span>New event</span>
            </a>
            <div class="dash-skel"></div>
            <div class="dash-skel"></div>
        </aside>
    </div>

    <!-- Card action popover -->
    <div class="dash-popover dash-popover--hidden" id="card-popover">
        <button class="dash-popover__item" data-action="edit">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            <span>Edit</span>
        </button>
        <button class="dash-popover__item" data-action="preview">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span>Preview</span>
        </button>
        <button class="dash-popover__item dash-popover__item--danger" data-action="delete">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            <span>Delete</span>
        </button>
    </div>

    <script>
        var RSVP_API = window.RNB_RSVP_API || 'https://k0e4amkowi.execute-api.us-east-2.amazonaws.com/rsvp';
        var token   = localStorage.getItem('rnb_creator_token');
        var creator = JSON.parse(localStorage.getItem('rnb_creator') || 'null');
        var allEvents = [];
        var activeTab = 'upcoming';

        document.addEventListener('DOMContentLoaded', function() {
            // Require auth — bounce to creator login if missing
            if (!token || !creator) {
                window.location.href = 'event-create.html';
                return;
            }
            initGreeting();
            loadEvents();
            // Close profile menu on outside click
            document.addEventListener('click', function(e) {
                var menu = document.getElementById('dash-profile-menu');
                var wrap = e.target.closest('.dash-profile-wrap');
                if (!wrap && menu.classList.contains('is-open')) menu.classList.remove('is-open');
            });
        });

        function initGreeting() {
            var name = creator.firstName || (creator.email ? creator.email.split('@')[0] : 'there');
            document.getElementById('dash-name').textContent = name;
            document.getElementById('dash-avatar').textContent = (name[0] || 'Y').toUpperCase();
        }

        async function loadEvents() {
            try {
                var res = await fetch(RSVP_API + '/creator/events', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.status === 401) {
                    localStorage.removeItem('rnb_creator_token');
                    localStorage.removeItem('rnb_creator');
                    window.location.href = 'event-create.html';
                    return;
                }
                var data = await res.json();
                allEvents = Array.isArray(data.events) ? data.events : [];
            } catch (e) {
                allEvents = [];
            }
            updateCounts();
            updateSummary();
            renderGrid();
        }

        function classifyEvent(ev) {
            var today = new Date(); today.setHours(0,0,0,0);
            var eventDate = ev.eventDate ? new Date(ev.eventDate + 'T00:00:00') : null;
            var isPast = eventDate && eventDate < today;
            if (ev.status === 'draft') return 'drafts';
            if (isPast) return 'past';
            return 'upcoming'; // hosting also includes these — duplicated logic in count
        }

        function filterEvents(tab) {
            var q = (document.getElementById('dash-search-input').value || '').toLowerCase().trim();
            return allEvents.filter(function(ev) {
                var cls = classifyEvent(ev);
                var match = false;
                if (tab === 'search') match = true;
                else if (tab === 'upcoming') match = (cls === 'upcoming');
                else if (tab === 'hosting') match = (ev.status === 'published'); // creator is host of every event they made
                else if (tab === 'drafts') match = (ev.status === 'draft');
                else if (tab === 'past') match = (cls === 'past');
                if (!match) return false;
                if (q) {
                    var hay = ((ev.eventName || '') + ' ' + (ev.venue || '') + ' ' + (ev.eventDate || '')).toLowerCase();
                    return hay.indexOf(q) !== -1;
                }
                return true;
            }).sort(function(a, b) {
                // Upcoming: ascending by date; Past: descending
                var da = a.eventDate || ''; var db = b.eventDate || '';
                if (tab === 'past') return db.localeCompare(da);
                return da.localeCompare(db);
            });
        }

        function updateCounts() {
            var counts = { upcoming:0, hosting:0, drafts:0, past:0 };
            allEvents.forEach(function(ev) {
                var cls = classifyEvent(ev);
                if (cls === 'upcoming') counts.upcoming++;
                if (cls === 'past') counts.past++;
                if (ev.status === 'draft') counts.drafts++;
                if (ev.status === 'published') counts.hosting++;
            });
            Object.keys(counts).forEach(function(k) {
                var el = document.querySelector('.dash-tab__count[data-count="' + k + '"]');
                if (el) el.textContent = counts[k];
            });
        }

        function updateSummary() {
            var upcoming = allEvents.filter(function(e) { return classifyEvent(e) === 'upcoming'; }).length;
            var msg;
            if (upcoming === 0) msg = 'No upcoming events yet — <strong>create your first one!</strong>';
            else if (upcoming === 1) msg = 'You have <strong>1 upcoming event.</strong>';
            else msg = 'You have <strong>' + upcoming + ' upcoming events.</strong>';
            document.getElementById('dash-summary').innerHTML = msg;
        }

        function setDashTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.dash-tab').forEach(function(t) {
                t.classList.toggle('is-active', t.dataset.tab === tab);
            });
            document.getElementById('dash-search-wrap').classList.toggle('is-open', tab === 'search');
            renderGrid();
        }

        function formatDate(dateStr, timeStr) {
            if (!dateStr) return '';
            var d = new Date(dateStr + 'T' + (timeStr || '00:00') + ':00');
            if (isNaN(d.getTime())) return dateStr;
            var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            var day = days[d.getDay()];
            var month = d.getMonth() + 1;
            var date = d.getDate();
            var time = '';
            if (timeStr) {
                var h = parseInt(timeStr.split(':')[0], 10);
                var ampm = h >= 12 ? 'pm' : 'am';
                h = h % 12 || 12;
                time = ' at ' + h + (timeStr.split(':')[1] !== '00' ? ':' + timeStr.split(':')[1] : '') + ampm;
            }
            return day + ' ' + month + '/' + date + time;
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, function(c) {
                return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
            });
        }

        function renderGrid() {
            var grid = document.getElementById('dash-grid');
            var events = filterEvents(activeTab);
            var html = '';
            // New event tile always at top (except past)
            if (activeTab !== 'past') {
                html += '<a class="dash-card--new" href="event-create.html?new=1">'
                    + '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>'
                    + '<span>New event</span>'
                    + '</a>';
            }
            events.forEach(function(ev) {
                var datePill = formatDate(ev.eventDate, ev.eventTime);
                var cover = ev.coverImageUrl
                    ? '<div class="dash-card__cover" style="background-image:url(\'' + escapeHtml(ev.coverImageUrl) + '\')"></div>'
                    : '<div class="dash-card__cover dash-card__cover--placeholder">' + escapeHtml((ev.eventName || 'E')[0].toUpperCase()) + '</div>';
                var badge = ev.status === 'draft'
                    ? '<div class="dash-card__badge dash-card__badge--draft">DRAFT</div>'
                    : '<div class="dash-card__badge dash-card__badge--published">🎉 LIVE</div>';
                var href = ev.status === 'draft'
                    ? 'event-create.html?draft=' + encodeURIComponent(ev.eventId)
                    : 'event.html?id=' + encodeURIComponent(ev.eventId);
                html += '<a class="dash-card" href="' + href + '" data-id="' + ev.eventId + '">'
                    + cover
                    + '<div class="dash-card__shade"></div>'
                    + (datePill ? '<div class="dash-card__date">' + escapeHtml(datePill) + '</div>' : '')
                    + '<button class="dash-card__menu" data-menu="' + ev.eventId + '" title="More"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="6" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="18" r="1.7"/></svg></button>'
                    + badge
                    + '<div class="dash-card__title">' + escapeHtml(ev.eventName || 'Untitled event') + '</div>'
                    + '</a>';
            });
            // Empty state for the rail
            if (events.length === 0) {
                var emptyMsg = {
                    upcoming: 'No upcoming events yet.',
                    hosting:  'Nothing hosted yet.',
                    drafts:   'No drafts saved.',
                    past:     'No past events.',
                    search:   'Type to search your events.'
                }[activeTab] || '';
                html += '<div class="dash-thumbs__empty">' + emptyMsg + '</div>';
            }
            grid.innerHTML = html;
            // Wire ellipsis menu buttons
            grid.querySelectorAll('[data-menu]').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    showCardMenu(btn.dataset.menu, btn);
                });
            });
        }

        /* ── Card ellipsis popover (Edit / Preview / Delete) ─── */
        var _menuEventId = null;
        function showCardMenu(eventId, anchorBtn) {
            _menuEventId = eventId;
            var pop = document.getElementById('card-popover');
            var rect = anchorBtn.getBoundingClientRect();
            pop.style.top  = (rect.bottom + 6) + 'px';
            pop.style.left = Math.min(rect.right - 170, window.innerWidth - 180) + 'px';
            pop.classList.remove('dash-popover--hidden');
        }
        function hideCardMenu() {
            document.getElementById('card-popover').classList.add('dash-popover--hidden');
            _menuEventId = null;
        }
        function bindPopover() {
            document.getElementById('card-popover').querySelectorAll('[data-action]').forEach(function(btn) {
                btn.addEventListener('click', async function() {
                    var action = btn.dataset.action;
                    var id = _menuEventId;
                    hideCardMenu();
                    if (!id) return;
                    var ev = allEvents.find(function(e) { return e.eventId === id; });
                    if (!ev) return;
                    if (action === 'edit') {
                        window.location.href = 'event-create.html?draft=' + encodeURIComponent(id);
                    } else if (action === 'preview') {
                        window.open('event.html?id=' + encodeURIComponent(id), '_blank');
                    } else if (action === 'delete') {
                        if (!confirm('Delete "' + (ev.eventName || 'this event') + '"?\nThis cannot be undone.')) return;
                        try {
                            var res = await fetch(RSVP_API + '/events/' + encodeURIComponent(id), {
                                method: 'DELETE',
                                headers: { 'Authorization': 'Bearer ' + token }
                            });
                            var data = await res.json();
                            if (data.error) { alert(data.error); return; }
                            allEvents = allEvents.filter(function(e) { return e.eventId !== id; });
                            updateCounts(); updateSummary(); renderGrid();
                        } catch (e) {
                            alert('Failed to delete. Please try again.');
                        }
                    }
                });
            });
            document.addEventListener('click', function(e) {
                if (!e.target.closest('#card-popover') && !e.target.closest('[data-menu]')) hideCardMenu();
            });
            document.addEventListener('scroll', hideCardMenu, true);
            window.addEventListener('resize', hideCardMenu);
        }
        document.addEventListener('DOMContentLoaded', bindPopover);

        function toggleProfileMenu() {
            document.getElementById('dash-profile-menu').classList.toggle('is-open');
        }

        function signOut() {
            localStorage.removeItem('rnb_creator_token');
            localStorage.removeItem('rnb_creator');
            window.location.href = 'event-create.html';
        }

        /* ─────────────────────────────────────────────── */
        /* RNB Co-Pilot chat (proxied through Lambda)       */
        /* API key lives server-side as Lambda env var      */
        /* ─────────────────────────────────────────────── */

        function appendChat(role, text) {
            var box = document.getElementById('chat-messages');
            var welcome = box.querySelector('.dash-chat__welcome');
            if (welcome) welcome.remove();
            var div = document.createElement('div');
            div.className = 'dash-chat__msg dash-chat__msg--' + role;
            div.textContent = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
            return div;
        }
        function showTyping() {
            var box = document.getElementById('chat-messages');
            var t = document.createElement('div');
            t.className = 'dash-chat__typing';
            t.id = 'chat-typing';
            t.innerHTML = '<span></span><span></span><span></span>';
            box.appendChild(t);
            box.scrollTop = box.scrollHeight;
        }
        function hideTyping() {
            var t = document.getElementById('chat-typing');
            if (t) t.remove();
        }

        var chatHistory = []; // [{role:'user'|'model', text:''}]

        async function sendChat() {
            var input = document.getElementById('chat-input');
            var text = (input.value || '').trim();
            if (!text) return;
            input.value = '';
            input.style.height = 'auto';
            return doSendPrompt(text);
        }

        function sendChatPrompt(text) {
            return doSendPrompt(text);
        }

        async function doSendPrompt(text) {
            appendChat('user', text);
            chatHistory.push({ role: 'user', text: text });
            showTyping();
            document.getElementById('chat-send').disabled = true;
            try {
                var res = await fetch(RSVP_API + '/ai/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ messages: chatHistory })
                });
                var data = await res.json();
                hideTyping();
                if (!res.ok || data.error) {
                    appendChat('ai', '⚠ ' + (data.error || 'AI service error. Please try again.'));
                    return;
                }
                chatHistory.push({ role: 'model', text: data.reply });
                appendChat('ai', data.reply);
            } catch (e) {
                hideTyping();
                appendChat('ai', '⚠ Network error. Please try again.');
            } finally {
                document.getElementById('chat-send').disabled = false;
            }
        }

        // Auto-grow textarea + Enter to send
        document.addEventListener('DOMContentLoaded', function() {
            var ta = document.getElementById('chat-input');
            if (!ta) return;
            ta.addEventListener('input', function() {
                ta.style.height = 'auto';
                ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
            });
            ta.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
            });
        });
    </script>

</body>
