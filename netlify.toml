[build]
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/Client/SeatingandLayout"
  to   = "/Client/seating-layout"
  status = 301

[[redirects]]
  from = "/Client/Seating-Layout"
  to   = "/Client/seating-layout"
  status = 301

[[redirects]]
  from = "/Prospect"
  to   = "/Stats"
  status = 301

[[redirects]]
  from = "/Prospect/*"
  to   = "/Stats/:splat"
  status = 301

[[redirects]]
  from = "/Stat"
  to   = "/Stats"
  status = 301

[[redirects]]
  from = "/Stat/*"
  to   = "/Stats/:splat"
  status = 301

# Guest seat finder — hashed URL rewrite (no login required)
[[redirects]]
  from   = "/gs/*"
  to     = "/gs.html"
  status = 200

# RSVP event pages
[[redirects]]
  from   = "/event/:id"
  to     = "/event.html?id=:id"
  status = 200

[[redirects]]
  from   = "/create-event"
  to     = "/event-create.html"
  status = 200

[[redirects]]
  from   = "/my-events"
  to     = "/my-events.html"
  status = 200
